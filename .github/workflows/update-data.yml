name: Actualizar datos del panel

on:
  schedule:
    - cron: '*/15 * * * *'   # cada 15 min — GitHub puede demorarlo unos minutos más en horas de mucha carga
  workflow_dispatch: {}       # botón "Run workflow" para forzarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Descargar y precalcular datos
        run: node scripts/fetch-data.js

      - name: Commitear si hay cambios
        run: |
          git config user.name "panel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Sin cambios, no hay nada que commitear."
          else
            git commit -m "Actualiza datos del panel [automático]"
            git push
          fi
